<!-- Blue arrow on WHITE.

     This file used to fill the whole canvas with #131314, so the icon genuinely WAS a
     near-black square with a blue mark on it, and Google was rendering exactly what it
     was given. It was never a caching or an indexing problem.

     Sized for a circular crop: Google's result rows, and most browsers' tab strips,
     mask the icon to a circle. The mark is centred and spans about 55% of the canvas,
     so its corners stay well inside the inscribed circle and nothing is clipped. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#ffffff"/>
  <g transform="translate(117.8 104) scale(2.304)">
    <path d="M60 5 C68 27 90 78 114 128 C95 104 70 84 60 72 C50 84 25 104 6 128 C30 78 52 27 60 5Z" fill="#0088ff"/>
  </g>
</svg>
